<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>PROFIL.EXE — Qui est votre formateur ?</title>
<!--
  Version « blocs » du jeu PROFIL.EXE, pour la formation Minecraft Education.
  Les textes (questions, révélations, résumé) sont copiés de
  boite-outils-prof/profil-ludo/index.html : les modifier aux deux endroits.
  Textures dessinées par le script (aucune texture, police ni logo Minecraft).
  Clin d'œil non officiel. Fonctionne hors ligne.
-->
<style>
  @font-face{
    font-family:'Figtree';
    src:url('fonts/figtree-latin.woff2') format('woff2');
    font-weight:300 900; font-display:swap;
  }

  :root{
    --mono:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --tuile:2em;
    --bloc:2.4em;
    --sol-h:calc(var(--bloc) * 2);
  }
  *{box-sizing:border-box}
  html{font-size:clamp(14px, min(3.5vw, 2.75vh), 19px); -webkit-text-size-adjust:100%}
  body{margin:0; overflow:hidden; background:#78c4f2; font-family:var(--police); color:var(--encre); font-weight:500}

  /* ---------- trois habillages (mêmes contenus) ---------- */
  body, body.t-prairie{
    --police:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ciel:linear-gradient(#6fbdf0 0%, #a9dbf8 62%, #dcf2fd 100%);
    --t-solhaut:var(--tx-grassSide); --t-sol:var(--tx-dirt);
    --t-panneau:var(--tx-birch);   --voile:rgba(255,251,238,.6);
    --t-titre:var(--tx-oak);       --voile-titre:rgba(45,26,8,.42);
    --t-bouton:var(--tx-stone);    --voile-bouton:rgba(255,255,255,.52);
    --t-primaire:var(--tx-emerald);--voile-primaire:rgba(8,48,14,.16);
    --t-accent:var(--tx-gold);     --voile-accent:rgba(255,250,226,.7);
    --ch:var(--tx-grassTop); --cs:var(--tx-grassSide); --cb:var(--tx-dirt);
    --contour:#2a2015; --encre:#2a2016; --encre-douce:#5b4b36; --encre-bouton:#1d1d1d;
    --fort:#1f6a2b; --poussiere:#a07d56; --survol:#fff;
    --rayon:0; --ombre:0 .3em 0 rgba(0,0,0,.28);
    --biseau:inset .2em .2em 0 rgba(255,255,255,.42), inset -.2em -.2em 0 rgba(0,0,0,.2);
  }
  body.t-unicorn{
    --police:ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', system-ui, sans-serif;
    --ciel:linear-gradient(165deg,#FFD1F0 0%,#D9C8FF 48%,#BFEBFF 100%);
    --t-solhaut:var(--tx-candySide); --t-sol:var(--tx-lilac);
    --t-panneau:var(--tx-cloud);   --voile:rgba(255,255,255,.5);
    --t-titre:var(--tx-pink);      --voile-titre:rgba(190,20,120,.42);
    --t-bouton:var(--tx-lilac);    --voile-bouton:rgba(255,255,255,.6);
    --t-primaire:var(--tx-pink);   --voile-primaire:rgba(225,30,140,.58);
    --t-accent:var(--tx-gold);     --voile-accent:rgba(255,249,232,.74);
    --ch:var(--tx-pink); --cs:var(--tx-candySide); --cb:var(--tx-lilac);
    --contour:#d958ad; --encre:#5B2D82; --encre-douce:#7d5aa3; --encre-bouton:#5B2D82;
    --fort:#d1207f; --poussiere:#f8c4e6; --survol:#fff;
    --rayon:.7em; --ombre:0 .3em 0 rgba(255,111,200,.35);
  }
  body.t-minimal{
    --police:system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ciel:linear-gradient(#ececea, #f5f5f3);
    --t-solhaut:var(--tx-quartzDark); --t-sol:var(--tx-quartzDark);
    --t-panneau:var(--tx-quartz);  --voile:rgba(255,255,255,.55);
    --t-titre:none;                --voile-titre:#1b1b1b;
    --t-bouton:var(--tx-quartz);   --voile-bouton:rgba(255,255,255,.5);
    --t-primaire:none;             --voile-primaire:#1b1b1b;
    --t-accent:var(--tx-quartz);   --voile-accent:rgba(246,246,244,.85);
    --ch:var(--tx-quartz); --cs:var(--tx-quartz); --cb:var(--tx-quartzDark);
    --contour:#c9c9c7; --encre:#1b1b1b; --encre-douce:#5f5f5d; --encre-bouton:#1b1b1b;
    --fort:#111; --poussiere:#d8d8d5; --survol:#1b1b1b;
    --rayon:.3em; --ombre:0 .15em 0 rgba(0,0,0,.08);
    --biseau:inset 0 0 0 0 transparent;
  }

  /* ---------- le monde ---------- */
  .monde{position:relative; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; isolation:isolate}
  .ciel{position:absolute; inset:0; z-index:-3; background:var(--ciel); transition:filter .6s}
  .soleil{position:absolute; top:9%; right:11%; width:3em; height:3em; background:#fff7b0;
    box-shadow:0 0 0 .45em rgba(255,247,176,.35), 0 0 3.5em 1em rgba(255,236,140,.55)}
  body.t-unicorn .soleil{background:#fff; box-shadow:0 0 0 .45em rgba(255,255,255,.5), 0 0 3em 1em rgba(255,190,240,.7)}
  body.t-minimal .soleil, body.t-minimal .nuage{display:none}
  .nuage{position:absolute; left:0; height:1.1em; width:7em; background:#fff; opacity:.92;
    box-shadow:1.6em -1.1em 0 -.0em #fff, 3.8em -1.1em 0 0 #fff;
    animation:nuage linear infinite}
  .nuage::before{content:""; position:absolute; left:1.6em; top:-1.1em; width:3.6em; height:1.1em; background:#fff}
  .nuage.n1{top:14%; animation-duration:70s; animation-delay:-12s}
  .nuage.n2{top:27%; width:5em; animation-duration:95s; animation-delay:-60s; opacity:.75}
  .nuage.n3{top:6%;  width:9em; animation-duration:120s; animation-delay:-35s; opacity:.6}
  @keyframes nuage{from{transform:translateX(-12em)} to{transform:translateX(calc(100vw + 2em))}}

  .nuit{position:absolute; inset:0; z-index:-2; opacity:0; pointer-events:none; transition:opacity 1.4s ease;
    background:linear-gradient(#060a1d 0%, #16204a 65%, #2b3a6e 100%)}
  .monde.de-nuit .nuit{opacity:1}
  .lune{position:absolute; top:10%; left:14%; width:2.4em; height:2.4em; background:#eef0ff;
    box-shadow:inset -.5em -.4em 0 #c9cde8, 0 0 2.5em .5em rgba(200,210,255,.35)}
  .etoile{position:absolute; width:.22em; height:.22em; background:#fff; animation:scintille 3s ease-in-out infinite}
  @keyframes scintille{50%{opacity:.25}}

  .barre{position:relative; z-index:3; display:flex; justify-content:space-between; gap:1em;
    padding:.55em 1em; padding-top:max(.55em, env(safe-area-inset-top));
    background:rgba(0,0,0,.45); color:#fff; font:700 .78em/1.2 var(--mono); letter-spacing:.08em}
  .barre[hidden]{display:none}

  .zone{position:relative; z-index:1; flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; -webkit-overflow-scrolling:touch}
  .pile{min-height:100%; max-width:40em; margin:0 auto; padding:1em 1em .9em; display:flex; flex-direction:column; gap:.6em}
  .pile > :first-child{margin-top:auto}
  .pile.haut > :first-child{margin-top:0}   /* questions : le contenu commence en haut de l'écran */
  .pile-ancienne{position:absolute; left:0; right:0; top:0; pointer-events:none}

  .sol{position:relative; z-index:2; flex:none; height:var(--sol-h);
    background:var(--t-solhaut) 0 0/var(--bloc) var(--bloc) repeat-x, var(--t-sol) 0 0/var(--bloc) var(--bloc) repeat;
    image-rendering:pixelated; transition:filter 1.4s;
    box-shadow:0 -.25em 0 rgba(0,0,0,.12)}
  .monde.de-nuit .sol{filter:brightness(.4) saturate(.7)}
  .licence{position:absolute; left:0; right:0; bottom:max(.45em, env(safe-area-inset-bottom)); margin:0; padding:0 1em;
    text-align:center; font:500 .62em/1.3 var(--police); color:rgba(255,255,255,.9); text-shadow:0 1px 0 rgba(0,0,0,.65)}
  body.t-minimal .licence{color:#555; text-shadow:none}

  canvas.terrain{position:absolute; left:0; top:0; width:100%; height:calc(100% - var(--sol-h)); z-index:0;
    transition:opacity .9s linear, transform .8s cubic-bezier(.5,0,1,.6); image-rendering:pixelated}
  canvas.terrain.voile{opacity:.4}
  canvas.terrain.chute{transform:translateY(110%); opacity:0}

  #fx{position:fixed; inset:0; z-index:20; pointer-events:none; overflow:hidden}
  .part{position:absolute; display:block; image-rendering:pixelated}

  /* ---------- les blocs ---------- */
  .b{position:relative; margin:0; border:.16em solid var(--contour); border-radius:var(--rayon);
    background:linear-gradient(var(--voile),var(--voile)), var(--t-panneau) 0 0/var(--tuile) var(--tuile);
    box-shadow:var(--biseau), var(--ombre);
    padding:.75em .95em; color:var(--encre); image-rendering:pixelated;
    font-size:1em; line-height:1.45}
  h1.b{background:linear-gradient(var(--voile-titre),var(--voile-titre)), var(--t-titre) 0 0/var(--tuile) var(--tuile);
    color:#fff; font-size:1.32em; line-height:1.25; font-weight:800; letter-spacing:-.01em;
    text-shadow:.08em .08em 0 rgba(0,0,0,.45)}
  body.t-minimal h1.b{text-shadow:none}
  .dim{color:var(--encre-douce)}
  p.dim.b{font-size:.95em}
  strong{color:var(--fort); font-weight:800}

  .cursor{display:inline-block; width:.5em; height:1em; margin-left:.2em; vertical-align:-.12em; background:currentColor; animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .btn{display:block; width:100%; text-align:left;
    background:linear-gradient(var(--voile-bouton),var(--voile-bouton)), var(--t-bouton) 0 0/var(--tuile) var(--tuile);
    color:var(--encre-bouton); line-height:1.35; transition:transform .08s}
  .btn.primaire{background:linear-gradient(var(--voile-primaire),var(--voile-primaire)), var(--t-primaire) 0 0/var(--tuile) var(--tuile);
    color:#fff; font-weight:800; font-size:1.1em; text-shadow:.07em .07em 0 rgba(0,0,0,.4)}
  body.t-minimal .btn.primaire{text-shadow:none; border-color:#1b1b1b}
  .start, .next, .replay, .themeswitch{width:auto; align-self:flex-start}
  .themeswitch{font-size:.85em; padding:.5em .85em; opacity:.92}
  @media (hover:hover){ .btn:hover:not(:disabled){outline:.16em solid var(--survol); outline-offset:-.38em} }
  .btn:active:not(:disabled){transform:translateY(.12em)}
  .btn:focus-visible, .lnk:focus-visible{outline:.2em solid #ffd400; outline-offset:.15em}
  .btn:disabled{cursor:default}

  .options{display:flex; flex-direction:column; gap:.5em}
  .opt{display:flex; gap:.75em; align-items:center}
  .opt .key{flex:none; display:grid; place-items:center; width:1.75em; height:1.75em; background:rgba(0,0,0,.55); color:#fff;
    font:800 .95em/1 var(--mono); box-shadow:inset -.12em -.12em 0 rgba(255,255,255,.18); border-radius:calc(var(--rayon) * .6)}
  .opt.is-answer{background:linear-gradient(rgba(160,238,170,.8),rgba(160,238,170,.8)), var(--tx-emerald) 0 0/var(--tuile) var(--tuile);
    border-color:#1f6b2c; color:#0f3d17}
  .opt.is-answer .key{background:#1f6b2c}
  .opt.is-wrongpick{background:linear-gradient(rgba(255,196,186,.86),rgba(255,196,186,.86)), var(--t-bouton) 0 0/var(--tuile) var(--tuile);
    border-color:#9b2a1f; color:#7d1d14; text-decoration:line-through}
  .opt.is-wrongpick .key{background:#9b2a1f}
  .opt.is-mute{opacity:.42}

  .reveal p{margin:.45em 0 .8em}
  .verdict{display:flex; align-items:center; gap:.5em; font-weight:800}
  .verdict .mark{display:grid; place-items:center; width:1.45em; height:1.45em; color:#fff; font-weight:900; border-radius:calc(var(--rayon) * .6)}
  .verdict.ok .mark{background:#2b8a3e} .verdict.ok .mark::before{content:"\2713"}
  .verdict.ko .mark{background:#b3261e} .verdict.ko .mark::before{content:"\2717"}

  /* barre d'objets = progression */
  .hotbar{align-self:flex-start; display:flex; align-items:center; gap:.25em; padding:.3em .55em .3em .3em;
    background:rgba(0,0,0,.5); border-color:#1a1a1a; color:#fff}
  .slot{width:2.3em; height:2.3em; display:grid; place-items:center; background:rgba(150,150,150,.55);
    box-shadow:inset .14em .14em 0 rgba(0,0,0,.45), inset -.14em -.14em 0 rgba(255,255,255,.28); border-radius:calc(var(--rayon) * .5)}
  .slot.ici{outline:.16em solid #fff; outline-offset:.04em}
  .hb-n{margin-left:.5em; font:800 .95em var(--mono)}

  /* cube 3D */
  .cube{--s:1.3em; position:relative; display:inline-block; flex:none; width:var(--s); height:var(--s);
    transform-style:preserve-3d; transform:rotateX(-30deg) rotateY(45deg)}
  .cube i{position:absolute; inset:0; background-image:var(--k-s, var(--cs)); background-size:100% 100%; image-rendering:pixelated;
    box-shadow:inset 0 0 0 .04em rgba(0,0,0,.25); backface-visibility:hidden}
  .cube .h{background-image:var(--k-h, var(--ch)); transform:rotateX(90deg) translateZ(calc(var(--s) / 2))}
  .cube .bas{background-image:var(--k-b, var(--cb)); transform:rotateX(-90deg) translateZ(calc(var(--s) / 2)); filter:brightness(.5)}
  .cube .f1{transform:translateZ(calc(var(--s) / 2)); filter:brightness(.84)}
  .cube .f2{transform:rotateY(90deg) translateZ(calc(var(--s) / 2)); filter:brightness(.66)}
  .cube .f3{transform:rotateY(180deg) translateZ(calc(var(--s) / 2)); filter:brightness(.84)}
  .cube .f4{transform:rotateY(-90deg) translateZ(calc(var(--s) / 2)); filter:brightness(.66)}
  .cube.herbe{--k-h:var(--tx-grassTop); --k-s:var(--tx-grassSide); --k-b:var(--tx-dirt)}
  .cube.rose{--k-h:var(--tx-pink); --k-s:var(--tx-candySide); --k-b:var(--tx-lilac)}
  .cube.quartz{--k-h:var(--tx-quartz); --k-s:var(--tx-quartz); --k-b:var(--tx-quartzDark)}
  .cube.or{--k-h:var(--tx-gold); --k-s:var(--tx-gold); --k-b:var(--tx-gold)}
  .cube.pose{animation:pose .35s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes pose{from{transform:rotateX(-30deg) rotateY(45deg) translateY(-1.2em) scale(.4)} }

  /* écran éteint = la nuit */
  .offscreen{margin:auto 0 !important; display:flex; flex-direction:column; align-items:center; gap:.6em; padding:1em 0}
  .pwr{position:relative; background:none; border:0; padding:2.2em 2.6em 1.6em; border-radius:1em}
  .pwr:focus-visible{outline:.2em solid #ffd400}
  .flotte{display:block; animation:flotte 3.2s ease-in-out infinite}
  .cube.gros{--s:5.2em; animation:tourne 11s linear infinite}
  @keyframes tourne{from{transform:rotateX(-26deg) rotateY(0deg)} to{transform:rotateX(-26deg) rotateY(360deg)}}
  @keyframes flotte{50%{transform:translateY(-.55em)}}
  .ombre-cube{display:block; width:5.4em; height:.7em; margin:1.9em auto 0; background:rgba(0,0,0,.45); border-radius:50%;
    animation:ombre 3.2s ease-in-out infinite}
  @keyframes ombre{50%{transform:scale(.82); opacity:.6}}
  .pwr.casse .flotte, .pwr.casse .ombre-cube{visibility:hidden}
  .pwrlabel{margin:0; color:#fff; font:800 .8em/1.4 var(--mono); letter-spacing:.14em; text-transform:uppercase;
    text-shadow:.12em .12em 0 rgba(0,0,0,.6); animation:respire 2.4s ease-in-out infinite}
  @keyframes respire{50%{opacity:.55}}

  /* séquence de connexion : boîte de discussion */
  .quoteblock.b{background:rgba(0,0,0,.62); border-color:rgba(0,0,0,.85); color:#fff; font-family:var(--mono);
    box-shadow:none; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); border-radius:var(--rayon);
    min-height:9em; display:flex; flex-direction:column; justify-content:center; gap:.5em; transition:opacity .45s linear}
  .quoteblock p{margin:0; white-space:pre-wrap; max-width:44ch}
  .quoteblock .conn{font-size:.95em; line-height:1.5}
  .quoteblock .line{font-size:1.25em; line-height:1.35; color:#ffe27a; text-shadow:.08em .08em 0 #3a2a00}
  .quoteblock .ask{color:#8fe3ff}
  .quoteblock.fadeout{opacity:0}
  .tc{display:inline-block; width:.5em; height:1em; vertical-align:-.12em; background:#fff; animation:blink .9s steps(1) infinite}
  .dots::after{content:""; animation:dots 1.1s steps(4,end) infinite}
  @keyframes dots{0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} 100%{content:""}}

  .loadbar, .meter{display:flex; align-items:center; gap:.6em}
  .barreblocs{flex:1; display:flex; gap:.14em; max-width:18em}
  .barreblocs i{flex:1; height:.95em; background:rgba(255,255,255,.14); box-shadow:inset -.1em -.1em 0 rgba(0,0,0,.35)}
  .barreblocs i.on{background:var(--tx-emerald) 0 0/.95em .95em; image-rendering:pixelated;
    box-shadow:inset .1em .1em 0 rgba(255,255,255,.35), inset -.1em -.1em 0 rgba(0,0,0,.3)}
  .pct{font:800 .9em var(--mono); min-width:3.2em}
  .meter.b{background:rgba(0,0,0,.5); color:#fff; border-color:#1a1a1a}
  .ligne.b{font-family:var(--mono); font-size:.9em; padding:.5em .8em; display:flex; justify-content:space-between; gap:.6em}
  .ligne .ok{flex:none; padding:0 .45em; background:#2b8a3e; color:#fff; font-weight:800}
  .ligne.hi{color:var(--fort); font-weight:800}

  /* portrait construit en blocs */
  .cadre.b{align-self:center; padding:.5em; line-height:0;
    background:linear-gradient(var(--voile-titre),var(--voile-titre)), var(--t-titre) 0 0/var(--tuile) var(--tuile)}
  .cadre.petit{align-self:flex-start}
  .pcanvas{display:block; width:min(12em, 60vw); height:auto; image-rendering:pixelated; background:rgba(0,0,0,.18)}
  .portrait{display:block; width:5.6em; height:auto; image-rendering:pixelated}
  body.t-prairie .pcanvas, body.t-prairie .portrait{filter:sepia(.85) saturate(1.5) hue-rotate(-8deg) contrast(1.05)}
  body.t-unicorn .pcanvas, body.t-unicorn .portrait{filter:hue-rotate(-95deg) saturate(1.3)}
  body.t-minimal .pcanvas, body.t-minimal .portrait{filter:grayscale(1) contrast(1.15)}

  /* fin */
  .score.b{font-size:1.1em}
  .resume h2{margin:0 0 .5em; font:800 .75em/1.3 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--encre-douce)}
  .resume p, .twist p{margin:0 0 .65em}
  .resume p:last-child, .twist p:last-child{margin-bottom:0}
  .twist.b{background:linear-gradient(var(--voile-accent),var(--voile-accent)), var(--t-accent) 0 0/var(--tuile) var(--tuile)}
  .links{display:flex; flex-wrap:wrap; gap:.55em}
  .lnk.b{flex:1 1 11em; display:flex; align-items:center; gap:.7em; text-decoration:none; color:var(--encre-bouton);
    background:linear-gradient(var(--voile-bouton),var(--voile-bouton)), var(--t-bouton) 0 0/var(--tuile) var(--tuile); font-weight:700}
  .lnk svg{width:1.4em; height:1.4em; flex:none}
  .lnk small{display:block; font-weight:500; font-size:.82em; color:var(--encre-douce)}
  @media (hover:hover){ .lnk:hover{outline:.16em solid var(--survol); outline-offset:-.38em} }

  .citation-film{font-size:1.2em; font-weight:800}

  /* thèmes à choisir */
  .themes{display:flex; flex-direction:column; gap:.55em}
  .tsw{display:flex; align-items:center; gap:1.1em; padding:.8em 1em}
  .tsw .cube{--s:1.9em; margin:.35em .45em}
  .tsw .name{display:block; font-size:1.1em; font-weight:800}
  .tsw .desc{display:block; font-size:.86em; color:var(--encre-douce)}
  .tsw.sw-uni{font-family:ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', system-ui, sans-serif}
  .tsw.sw-min{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}

  @media (prefers-reduced-motion: reduce){
    .cursor, .tc, .nuage, .etoile, .flotte, .cube.gros, .ombre-cube, .pwrlabel{animation:none}
  }
</style>
</head>
<body class="t-prairie">
<div class="monde de-nuit" id="monde">
  <div class="ciel" aria-hidden="true">
    <span class="soleil"></span>
    <span class="nuage n1"></span><span class="nuage n2"></span><span class="nuage n3"></span>
  </div>
  <div class="nuit" aria-hidden="true" id="nuit"><span class="lune"></span></div>
  <div class="barre" id="barre" hidden><span>PROFIL.EXE</span><span id="barre-d"></span></div>
  <main class="zone" id="zone"><div class="pile" id="screen"></div></main>
  <div class="sol" id="sol">
    <p class="licence">CC BY-NC-SA 4.0 · © 2026 Ludo (@rprof_1) · rprof1.com · style inspiré de Minecraft Education, non officiel</p>
  </div>
</div>
<div id="fx" aria-hidden="true"></div>

<script>
/* ============================================================
   TEXTURES — dessinées ici, pixel par pixel (16 × 16)
   ============================================================ */
function rng(seed){ return ()=>{ seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; }; }
function tuile(seed, dessin){
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d'); dessin(g, rng(seed)); return c;
}
function bruit(g, r, pal, y0 = 0, h = 16){
  for(let y = y0; y < y0 + h; y++) for(let x = 0; x < 16; x++){
    g.fillStyle = pal[(r() * pal.length) | 0]; g.fillRect(x, y, 1, 1);
  }
}
function points(g, r, n, pal){
  for(let i = 0; i < n; i++){ g.fillStyle = pal[(r() * pal.length) | 0]; g.fillRect((r() * 16) | 0, (r() * 16) | 0, 1, 1); }
}
function planches(seed, pal, trait){
  return tuile(seed, (g, r)=>{
    for(let y = 0; y < 16; y++){
      const bande = y >> 2, base = pal[(r() * pal.length) | 0];
      for(let x = 0; x < 16; x++){
        g.fillStyle = r() < .7 ? base : pal[(r() * pal.length) | 0];
        if(y % 4 === 3 || x === (bande % 2 ? 4 : 12)) g.fillStyle = trait;
        g.fillRect(x, y, 1, 1);
      }
    }
  });
}
function biseau(g, clair, fonce){
  g.fillStyle = clair; g.fillRect(0, 0, 16, 1); g.fillRect(0, 0, 1, 16);
  g.fillStyle = fonce; g.fillRect(0, 15, 16, 1); g.fillRect(15, 0, 1, 16);
}
function cote(seed, terre, dessus){
  return tuile(seed, (g, r)=>{
    bruit(g, r, terre);
    for(let x = 0; x < 16; x++){
      const h = 3 + (r() < .45 ? 1 : 0) + (r() < .2 ? 1 : 0);
      for(let y = 0; y < h; y++){ g.fillStyle = dessus[(r() * dessus.length) | 0]; g.fillRect(x, y, 1, 1); }
    }
  });
}

function shuffle(a){
  const b=a.slice();
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

/* tirage : 2 perso + 2 pro garantis, 5e au hasard */
function draw(){
  const perso=shuffle(BANK.filter(q=>q.axe==="perso"));
  const pro=shuffle(BANK.filter(q=>q.axe==="pro"));
  const picked=[...perso.slice(0,2),...pro.slice(0,2)];
  picked.push(shuffle([...perso.slice(2),...pro.slice(2)])[0]);
  return shuffle(picked);
}

function cube(cls){
  return `<span class="cube ${cls||''}"><i class="h"></i><i class="bas"></i><i class="f1"></i><i class="f2"></i><i class="f3"></i><i class="f4"></i></span>`;

/* progression : une barre d'objets à 5 cases */
function bar(){
  let s = '';
  for(let i = 0; i < 5; i++) s += `<span class="slot${i === step ? ' ici' : ''}">${i < step ? cube('or') : ''}</span>`;
  return `<div class="b hotbar" role="img" aria-label="Progression : ${step} sur 5">${s}<span class="hb-n">${step}/5</span></div>`;
}

function barreBlocs(pct){
  const n = Math.round(pct / 5);
  let s = '';
  for(let i = 0; i < 20; i++) s += i < n ? '<i class="on"></i>' : '<i></i>';
  return `<span class="barreblocs">${s}</span><span class="pct">${pct}%</span>`;
}

/* ============================================================
   EFFETS — chute, poussée, particules
   ============================================================ */
function particules(x, y, n, o){
  if(REDUIT) return;
  for(let i = 0; i < n; i++){
    const p = document.createElement('i');
    p.className = 'part';
    const s = o.taille * (0.7 + Math.random() * 0.6);
    p.style.cssText = `left:${x - s/2}px; top:${y - s/2}px; width:${s}px; height:${s}px;`;
    if(o.tex){
      p.style.background = `url(${o.tex}) ${-Math.random()*s*3}px ${-Math.random()*s*3}px / ${s*4}px ${s*4}px`;
    } else {
      p.style.background = o.couleurs[(Math.random() * o.couleurs.length) | 0];
    }
    fx.appendChild(p);
    const vx = (Math.random() - .5) * 2 * o.vx, vy = -o.vy * (0.5 + Math.random() * 0.7);
    const T = o.duree * (0.75 + Math.random() * 0.5), rot = (Math.random() - .5) * 540;
    const k = [];
    for(let j = 0; j <= 8; j++){
      const t = T * j / 8;
      k.push({ transform:`translate(${vx*t}px, ${vy*t + .5*o.g*t*t}px) rotate(${rot*j/8}deg)`, opacity: j < 5 ? 1 : 1 - (j - 4) / 4 });
    }
    p.animate(k, { duration: T * 1000, easing:'linear' }).onfinish = ()=> p.remove();
  }
}

function poussiere(el){
  if(calme() || !el.isConnected) return;
  const r = el.getBoundingClientRect(), z = zone.getBoundingClientRect();
  if(r.bottom < z.top || r.bottom > z.bottom + 4) return;
  const c = getComputedStyle(document.body).getPropertyValue('--poussiere').trim();
  const t = parseFloat(getComputedStyle(document.documentElement).fontSize) * 0.32;
  [r.left + 4, r.right - 4].forEach((x, i)=>{
    for(let j = 0; j < 3; j++) particules(x, r.bottom - 3, 1, { couleurs:[c], taille:t, vx:10, vy:70, g:260, duree:.45 });
  });
}

/* un bloc tombe du ciel et se pose sur la pile */
function chute(el, delai){
  if(REDUIT) return;
  const z = zone.getBoundingClientRect(), r = el.getBoundingClientRect();
  const d = Math.max(80, r.bottom - z.top + 12);
  const dur = Math.round(170 + 19 * Math.sqrt(d));
  const rebond = Math.min(9, d * .025);
  el.animate([
    { transform:`translateY(${-d}px)`, easing:'cubic-bezier(.5,0,1,.6)' },
    { transform:'translateY(0)', offset:.8, easing:'cubic-bezier(0,.5,.5,1)' },
    { transform:`translateY(${-rebond}px)`, offset:.9, easing:'cubic-bezier(.5,0,1,.5)' },
    { transform:'translateY(0)' }
  ], { duration:dur, delay:delai, fill:'backwards' });
  setTimeout(()=> poussiere(el), delai + dur * .8);
}

/* tous les blocs d'un écran tombent, celui du bas d'abord */
function tomber(root){
  const els = [...root.querySelectorAll('.b')].reverse();
  els.forEach((el, i)=> chute(el, i * 95));
}

/* l'ancien écran s'enfonce dans le sol */
function casser(){
  if(REDUIT || !screen.children.length) return;
  const clone = screen.cloneNode(true);
  clone.removeAttribute('id');
  clone.querySelectorAll('[id]').forEach(e=> e.removeAttribute('id'));
  clone.classList.add('pile-ancienne');
  clone.style.top = (-zone.scrollTop) + 'px';
  clone.style.minHeight = zone.clientHeight + 'px';
  zone.appendChild(clone);
  clone.animate([{ opacity:1, transform:'translateY(0)' }, { opacity:0, transform:'translateY(2em)' }],
    { duration:230, easing:'ease-in' }).onfinish = ()=> clone.remove();
}

function afficher(html, haut){
  casser();
  screen.classList.toggle('haut', !!haut);
  screen.innerHTML = html;
  zone.scrollTop = 0;
  tomber(screen);
}

/* un bloc ajouté sort du sol, comme poussé par un piston, et soulève la pile */
function ajouter(parent, html){
  const anciens = [...screen.querySelectorAll('.b')];
  const avant = anciens.map(e=> e.getBoundingClientRect().top);
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const neufs = [...tmp.children];
  neufs.forEach(n=> parent.appendChild(n));
  if(!REDUIT){
    anciens.forEach((e, i)=>{
      const dy = avant[i] - e.getBoundingClientRect().top;
      if(Math.abs(dy) > 1) e.animate([{ transform:`translateY(${dy}px)` }, { transform:'translateY(0)' }],
        { duration:360, easing:'cubic-bezier(.2,.8,.3,1.15)' });
    });
    const solTop = document.getElementById('sol').getBoundingClientRect().top;
    neufs.forEach(n=>{
      const r = n.getBoundingClientRect();
      const d = Math.max(r.height + 8, solTop - r.top);
      n.animate([{ transform:`translateY(${d}px)` }, { transform:'translateY(0)' }],
        { duration:380, easing:'cubic-bezier(.2,.8,.3,1.12)' });
    });
  }
  const last = neufs[neufs.length - 1];
  if(last && last.getBoundingClientRect().bottom > zone.getBoundingClientRect().bottom){
    setTimeout(()=> zone.scrollTo({ top: zone.scrollHeight, behavior: REDUIT ? 'auto' : 'smooth' }), 120);
  }
  return neufs[0];
}

function boot(){
  bootDone = false;
  const wink = WINKS[Math.floor(Math.random()*WINKS.length)];
  lastWink = wink;

  afficher(sysbar("CONNEXION") + `<div class="b quoteblock" id="qb"></div>`);

  const qb = document.getElementById('qb');
  let typeTimer = null;

  /* ---- fin de sequence ---- */
  const NAV = /^(Arrow|Page|Home|End|Escape)/;
  const finish = (e)=>{
    if(e && e.type === 'keydown' && NAV.test(e.key)) return;
    if(bootDone) return;
    bootDone = true;
    clearTimeout(rainTimer);
    clearTimeout(typeTimer);
    cancelAnimationFrame(rainRAF);
    document.removeEventListener('click', finish);
    document.removeEventListener('keydown', finish);
    const c = monde.querySelector('canvas.terrain');
    if(c) c.remove();
    chooseTheme();
  };
  document.addEventListener('click', finish);
  document.addEventListener('keydown', finish);

  if(REDUIT){ finish(); return; }

  /* ---- machine a ecrire ---- */
  function type(el, text, speed, cb){
    let i = 0;
    el.innerHTML = '<span class="tc"></span>';
    const cur = el.querySelector('.tc');
    (function tick(){
      if(bootDone) return;
      if(i >= text.length){
        cur.remove();
        if(cb) typeTimer = setTimeout(cb, 0);
        return;
      }
      cur.insertAdjacentText('beforebegin', text[i]);
      i++;
      typeTimer = setTimeout(tick, text[i-1] === '\n' ? speed*6 : speed);
    })();
  }

  function addLine(cls){
    const el = document.createElement('p');
    el.className = cls;
    qb.appendChild(el);
    return el;
  }

  /* ---- des blocs tombent du ciel et s'empilent en collines ---- */
  const cv = document.createElement('canvas');
  cv.className = 'terrain';
  monde.insertBefore(cv, zone);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const B = Math.round(parseFloat(getComputedStyle(document.documentElement).fontSize) * 1.5);
  const cols = Math.ceil(W / B);
  const haut = new Array(cols).fill(0);
  const maxRangs = Math.max(3, Math.floor(H * 0.4 / B));
  const chutes = [];
  let poses = 0, pluie = true, t0 = performance.now();

  function hauteurCible(c){
    /* comme du sable : un bloc glisse vers la colonne voisine plus basse */
    for(let k = 0; k < 4; k++){
      const g = c > 0 ? haut[c-1] : 99, d = c < cols-1 ? haut[c+1] : 99;
      if(g < haut[c] - 1 && g <= d) c--;
      else if(d < haut[c] - 1) c++;
      else break;
    }
    return c;
  }
  function tuileDe(k, h){
    if(k === h - 1) return TX.grassSide;
    if(k < h - 4) return TX.stone;
    return TX.dirt;
  }
  function rain(now){
    rainRAF = requestAnimationFrame(rain);
    const dt = Math.min(.05, (now - t0) / 1000); t0 = now;
    if(pluie && poses + chutes.length < cols * maxRangs){
      for(let s = 0; s < 3; s++){
        if(Math.random() < .75) chutes.push({ c:(Math.random()*cols)|0, y:-B - Math.random()*H*.6, v:Math.random()*120 });
      }
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    for(let i = chutes.length - 1; i >= 0; i--){
      const b = chutes[i];
      b.v += 2400 * dt; b.y += b.v * dt;
      const sol = H - (haut[b.c] + 1) * B;
      if(b.y >= sol){
        const c = hauteurCible(b.c);
        haut[c]++; poses++;
        chutes.splice(i, 1);
      } else {
        ctx.drawImage(TX.grassSide, b.c * B, b.y, B, B);
      }
    }
    for(let c = 0; c < cols; c++){
      for(let k = 0; k < haut[c]; k++) ctx.drawImage(tuileDe(k, haut[c]), c * B, H - (k + 1) * B, B, B);
    }
  }
  rainRAF = requestAnimationFrame(rain);

  /* ---- coupure de la pluie ---- */
  function cutRain(cb){
    pluie = false;
    cv.classList.add('voile');
    rainTimer = setTimeout(()=>{ if(bootDone) return; cb(); }, 720);
  }

  /* ---- transition vers l'ecran titre ---- */
  function sweep(){
    if(bootDone) return;
    qb.classList.add('fadeout');
    cv.classList.add('chute');
    rainTimer = setTimeout(()=>{ finish(); }, 850);
  }

  /* ---- enchainement, tout en frappe ---- */
  rainTimer = setTimeout(()=>{
    if(bootDone) return;
    cutRain(()=>{

    const conn = addLine('conn');
    type(conn, "Connexion au serveur interne sécurisé de l'Edulab.\nVeuillez patienter", 26, ()=>{
      conn.insertAdjacentHTML('beforeend', '<span class="dots"></span>');

      rainTimer = setTimeout(()=>{
        if(bootDone) return;
        qb.innerHTML = '';
        const line = addLine('line');

        type(line, "> " + wink.q, 48, ()=>{
          rainTimer = setTimeout(()=>{
            if(bootDone) return;
            const ask = addLine('ask');

            type(ask, "Si vous avez la ref, vous avez connu les disquettes.", 34, ()=>{
              const meter = addLine('loadbar');
              let pct = 0;

              (function fill(){
                if(bootDone) return;
                meter.innerHTML = barreBlocs(pct);
                if(pct < 100){
                  pct += 2;
                  typeTimer = setTimeout(fill, 55);
                } else {
                  rainTimer = setTimeout(sweep, 700);
                }
              })();
            });
          }, 1600);
        });
      }, 1600);
    });
    });
  }, 2300);
}

  if(REDUIT){ final(); return; }

  let i = 0;
  (function next(){
    if(i < lines.length){
      ajouter(el, lines[i]);
      i++;
      setTimeout(next, 330);
      return;
    }
    const meter = ajouter(el, `<p class="b meter">${barreBlocs(0)}</p>`);

      meter.innerHTML = barreBlocs(pct);

    })();
  })();
}

/* ============================================================
   RÉCEPTION DU PORTRAIT — les pixels tombent et s'empilent,
   rangée par rangée, comme une construction en pixel art
   ============================================================ */
function portraitReveal(){
  afficher(sysbar("PORTRAIT.PCX") + `
    <p class="b dim" id="pstat">Réception de l'image…</p>
    <div class="b cadre"><canvas class="pcanvas" id="pc" width="440" height="540"></canvas></div>
    <div id="pbtn"></div>`);

  const cv = document.getElementById('pc');
  const ctx = cv.getContext('2d');
  const stat = document.getElementById('pstat');

  function done(){
    stat.innerHTML = "Image reçue.";
    ajouter(document.getElementById('pbtn'),
      `<button class="b btn primaire next" id="showprof">Continuer</button>`);
    document.getElementById('showprof').onclick = filmReveal;
  }

  const img = new Image();
  img.onload = ()=>{
    const S = 10, w = img.width, total = img.height;
    const src = document.createElement('canvas'); src.width = w; src.height = total;
    const sg = src.getContext('2d'); sg.drawImage(img, 0, 0);
    const px = sg.getImageData(0, 0, w, total).data;
    const base = document.createElement('canvas'); base.width = cv.width; base.height = cv.height;
    const bg = base.getContext('2d');

    function rangee(g, r, y){
      for(let x = 0; x < w; x++){
        const o = (r * w + x) * 4;
        if(px[o+3] < 20) continue;
        g.fillStyle = `rgb(${px[o]},${px[o+1]},${px[o+2]})`;
        g.fillRect(x*S, y, S, S);
        g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(x*S, y, S, 1); g.fillRect(x*S, y, 1, S);
        g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(x*S, y+S-1, S, 1); g.fillRect(x*S+S-1, y, 1, S);
      }
    }

    if(REDUIT){
      for(let r = 0; r < total; r++) rangee(ctx, r, r*S);
      done();
      return;
    }

    /* la rangée du bas tombe la première */
    const PAS = 40, rows = [];
    for(let i = 0; i < total; i++){
      const r = total - 1 - i, d = r*S + S*2;
      rows.push({ r, debut: i*PAS, dur: 110 + 26*Math.sqrt(d / S), d, posee:false });
    }
    let posees = 0;
    const t0 = performance.now();
    (function anim(now){
      const t = now - t0;
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.drawImage(base, 0, 0);
      for(const o of rows){
        if(o.posee || t < o.debut) continue;
        const k = Math.min(1, (t - o.debut) / o.dur);
        if(k >= 1){
          o.posee = true; posees++;
          rangee(bg, o.r, o.r*S);
          ctx.drawImage(base, 0, 0);
        } else {
          rangee(ctx, o.r, o.r*S - o.d*(1 - k*k));
        }
      }
      stat.innerHTML = "Réception de l'image… " + Math.round(posees/total*100) + "%";
      if(posees < total) requestAnimationFrame(anim);
      else setTimeout(done, 300);
    })(t0);
  };
  img.onerror = done;
  img.src = PORTRAIT_SRC;
}

function answer(choice, btn){
  const q=quiz[step];
  const good = choice===q.correct;
  if(good) score++;

  screen.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.correct) b.classList.add('is-answer');
    else if(i===choice) b.classList.add('is-wrongpick');
    else b.classList.add('is-mute');
  });

  if(btn && !calme()){
    const r = btn.getBoundingClientRect();
    const fs = parseFloat(getComputedStyle(document.documentElement).fontSize);
    if(good) particules(r.left + r.width/2, r.top + r.height/2, 22,
      { couleurs:['#46b356','#7fdc8c','#f6cf45','#fff1a8'], taille: fs*.42, vx: 240, vy: 380, g: 1200, duree: .9 });

      { couleurs:['rgba(90,90,90,.7)','rgba(140,140,140,.6)'], taille: fs*.7, vx: 60, vy: 90, g: -40, duree: .8 });
  }

  /* la case de la barre d'objets se remplit */
  const slot = screen.querySelectorAll('.slot')[step];
  if(slot){ slot.classList.remove('ici'); slot.innerHTML = cube('or pose'); }
  const n = screen.querySelector('.hb-n'); if(n) n.textContent = (step+1) + '/5';

  const last = step===4;
  ajouter(document.getElementById('rev'), `
    <div class="b reveal">
      <span class="verdict ${good?'ok':'ko'}"><span class="mark"></span>${good?'Réponse correcte':'Réponse incorrecte'}</span>
      <p>${q.reveal}</p>
      <button class="btn b primaire next" id="nx">${last?'Afficher le profil complet':'Question suivante'}</button>
    </div>`);
  document.getElementById('nx').onclick=()=>{
    step++;
    if(step<5) question(); else compile();
  };
}

/* ============================================================
   DANS LES DIAPOS (iframe) : les flèches et le balayage
   continuent de faire avancer la présentation
   ============================================================ */
if(window.parent !== window){
  const versDiapo = (key)=>{
    try{ window.parent.document.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles:true })); return true; }
    catch(_){ return false; }
  };
  document.addEventListener('keydown', e=>{
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(/^(Arrow(Left|Right)|Page(Up|Down)|Home|End|Escape)$/.test(e.key) && versDiapo(e.key)) e.preventDefault();
  });
  let x0 = null, y0 = null;
  document.addEventListener('touchstart', e=>{ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
  document.addEventListener('touchend', e=>{
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) versDiapo(dx < 0 ? 'ArrowRight' : 'ArrowLeft');
  }, { passive:true });
}
